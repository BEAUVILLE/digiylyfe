// ─── BLOCS : texte synchronisé par slide ─────────────────────────────────────

  "DIGIY BUSINESS. L'accélérateur des pistes du village. Travailler avec les nouveaux outils du business indépendant.",

// ─── SLIDESHOW manuel (hors lecture audio) ────────────────────────────────────
const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('sp');
const DUR=8000;
let cur=0, loopTimer=null, syncMode=false;

function goTo(i,fromSync){
  slides[cur].classList.remove('active');
  cur=(i+slides.length)%slides.length;
  slides[cur].classList.add('active');
  updateCounter();
  if(!fromSync) runProg();
}
function runProg(){
  if(!bar) return;
  bar.style.transition='none';bar.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bar.style.transition='width '+DUR+'ms linear';
    bar.style.width='100%';
  }));
}
function startLoop(){clearInterval(loopTimer);loopTimer=setInterval(()=>goTo(cur+1),DUR);}
function stopLoop(){clearInterval(loopTimer);}
function updateCounter(){
  const el=document.getElementById('slideCounter');
  if(el) el.textContent=(cur+1)+' / '+slides.length;
}
window.DIGIY_SLIDES={goTo,startLoop,stopLoop};

document.getElementById('bp')?.addEventListener('click',()=>{if(!syncMode){goTo(cur-1);startLoop();}});
document.getElementById('bn')?.addEventListener('click',()=>{if(!syncMode){goTo(cur+1);startLoop();}});
let tx=0;
const ss=document.getElementById('ss');
ss.addEventListener('touchstart',e=>tx=(e.touches&&e.touches[0]?e.touches[0]:e.changedTouches[0]).clientX,{passive:true});
ss.addEventListener('touchend',e=>{
  if(syncMode) return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>45){goTo(dx<0?cur+1:cur-1);startLoop();}
},{passive:true});

runProg();startLoop();
updateCounter();

// ─── CAPTION ─────────────────────────────────────────────────────────────────
const captionEl=document.getElementById('caption');
function showCaption(text){
  if(!captionEl) return;
  captionEl.textContent=text;
  captionEl.classList.add('visible');
}
function hideCaption(){
  if(!captionEl) return;
  captionEl.classList.remove('visible');
}

// ─── MOTEUR AUDIO SYNCHRONISÉ ─────────────────────────────────────────────────
// Stratégie : on joue chaque bloc via une SpeechSynthesisUtterance séparée.
// onend du bloc N → slide N+1 + lecture bloc N+1.
// C'est la méthode la plus fiable cross-browser (boundary events peu fiables sur mobile).

let rate=0.86, paused=false, pInt=null, fabOpen=false;
let digiyWakeLock=null;
let blocIndex=0, uttCurrent=null, isPlaying=false;

async function digiyKeepScreenAwake(){
  try{
    if('wakeLock' in navigator&&!digiyWakeLock){
      digiyWakeLock=await navigator.wakeLock.request('screen');
      digiyWakeLock?.addEventListener('release',()=>digiyWakeLock=null);
    }
  }catch(e){digiyWakeLock=null;}
}
async function digiyReleaseWakeLock(){
  try{if(digiyWakeLock){const l=digiyWakeLock;digiyWakeLock=null;await l.release();}}
  catch(e){digiyWakeLock=null;}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&isPlaying&&!paused) digiyKeepScreenAwake();
});

function speakBloc(index){
  if(index>=BLOCS.length){
    // fin
    digiyReleaseWakeLock();
    setStatus('✓ Vision terminée');
    setProgress(100);clearInterval(pInt);
    paused=false;isPlaying=false;syncMode=false;
    setFabState('stop');hideCaption();
    startLoop();
    return;
  }
  blocIndex=index;
  const text=BLOCS[index];
  goTo(index,true);
  showCaption(text);
  updateCounter();
  // progress bar bloc
  bar.style.transition='none';bar.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    // on estime la durée du bloc proportionnellement au total
    const totalChars=BLOCS.reduce((a,b)=>a+b.length,0);
    const blocDur=(text.length/totalChars)*(totalChars/(rate*14))*1000;
    bar.style.transition='width '+blocDur+'ms linear';
    bar.style.width='100%';
  }));

  const u=new SpeechSynthesisUtterance(phoneticize(text));
  u.lang='fr-FR';u.rate=rate;u.pitch=1;u.volume=1;
  const voices=window.speechSynthesis.getVoices();
  const frV=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));
  if(frV) u.voice=frV;
  uttCurrent=u;
  u.onend=()=>{
    if(!isPlaying) return;
    speakBloc(index+1);
  };
  u.onerror=(e)=>{
    if(e.error==='interrupted'||e.error==='canceled'||!isPlaying) return;
    digiyReleaseWakeLock();
    setStatus('⚠️ Erreur audio. Relance ÉCOUTE.');
    setFabState('stop');isPlaying=false;syncMode=false;hideCaption();startLoop();
  };
  window.speechSynthesis.speak(u);
}

function digiyPlay(){
  if(!('speechSynthesis' in window)){setStatus('⚠️ Audio non disponible.');return;}
  isPlaying=true;syncMode=true;
  window.speechSynthesis.cancel();
  clearInterval(pInt);
  paused=false;
  stopLoop();
  digiyKeepScreenAwake();
  setFabState('play');
  setStatus('▶ Lecture synchronisée…');
  startGlobalProg();
  speakBloc(0);
}

function digiyPause(){
  if(!('speechSynthesis' in window)) return;
  if(paused){
    window.speechSynthesis.resume();
    paused=false;
    digiyKeepScreenAwake();
    setStatus('▶ Reprise…');
    setElText('fabPauseBtn','⏸');
    setFabState('play');
  }else{
    window.speechSynthesis.pause();
    paused=true;
    digiyReleaseWakeLock();
    setStatus('⏸ Vision en pause');
    setElText('fabPauseBtn','▶');
    setFabState('pause');
  }
}

function digiyStop(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  digiyReleaseWakeLock();
  clearInterval(pInt);
  setProgress(0);
  paused=false;isPlaying=false;syncMode=false;
  setElText('fabPauseBtn','⏸');
  setStatus('DIGIY BUSINESS · prêt à écouter');
  setFabState('stop');
  hideCaption();
  startLoop();
}

function setRate(r,el){
  rate=r;
  document.querySelectorAll('.fab-spd').forEach(b=>b.classList.remove('on'));
  if(el) el.classList.add('on');
  if(isPlaying&&!paused){
    // relance propre depuis le bloc courant sans déclencher un double onend
    const resumeIndex=blocIndex;
    isPlaying=false;
    window.speechSynthesis.cancel();
    clearInterval(pInt);
    setTimeout(()=>{
      isPlaying=true;
      syncMode=true;
      stopLoop();
      setStatus('▶ Lecture synchronisée…');
      setFabState('play');
      startGlobalProg();
      speakBloc(resumeIndex);
    },120);
  }
}

function setProgress(p){
  const circ=document.getElementById('fabProgCircle');
  if(circ) circ.style.background=`conic-gradient(var(--gold) ${p*3.6}deg,transparent 0deg)`;
}
// progress global estimé
function startGlobalProg(){
  clearInterval(pInt);
  const totalChars=BLOCS.reduce((a,b)=>a+b.length,0);
  const totalMs=(totalChars/(rate*14))*1000;
  const t0=Date.now();
  pInt=setInterval(()=>{
    const p=Math.min(((Date.now()-t0)/totalMs)*100,99);
    setProgress(p);
  },800);
}

function setStatus(m){const el=document.getElementById('st');if(el)el.textContent=m;}
function setElText(id,h){const el=document.getElementById(id);if(el)el.textContent=h;}
function setFabState(s){
  const btn=document.getElementById('fabMain');const ico=document.getElementById('fabIcon');
  if(!btn||!ico) return;
  if(s==='play'){btn.classList.add('playing');ico.textContent='🎧';}
  if(s==='pause'){btn.classList.add('playing');ico.textContent='⏸';}
  if(s==='stop'){btn.classList.remove('playing');ico.textContent='🎧';}
}
function toggleFab(){fabOpen=!fabOpen;document.getElementById('fabPanel')?.classList.toggle('open',fabOpen);}
function closeFab(){fabOpen=false;document.getElementById('fabPanel')?.classList.remove('open');}
document.addEventListener('click',e=>{
  const wrap=document.getElementById('fabWrap');
  if(wrap&&!wrap.contains(e.target)) closeFab();
});
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  if(window.speechSynthesis.onvoiceschanged!==undefined){
    window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
  }
}
